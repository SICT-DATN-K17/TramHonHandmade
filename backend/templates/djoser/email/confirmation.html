{% load i18n %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Tài khoản đã được kích hoạt</title>
    <style>
        /* (Bạn có thể copy style từ file activation.html cho đồng bộ) */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f6f9fc; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .content { padding: 40px; color: #334155; line-height: 1.6; text-align: center; }
        .success-icon { background-color: #d1fae5; color: #10b981; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; font-size: 40px; }
        .btn { display: inline-block; background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); color: white !important; padding: 14px 32px; text-decoration: none; border-radius: 6px; font-weight: 600; margin-top: 20px; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3); }
        .footer { background-color: #f8fafc; padding: 20px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Kích hoạt thành công!</h1>
    </div>
    <div class="content">
        <div class="success-icon">&#10003;</div>
        <p>Xin chào {{ user.name }},</p>
        <p>Tài khoản của bạn tại {{ site_name }} đã được kích hoạt thành công.</p>
        <p>Bây giờ bạn có thể đăng nhập và bắt đầu khám phá.</p>
        <p style="text-align: center;">
            <a href="{{ url }}" class="btn">Đăng nhập ngay</a>
        </p>
    </div>
    <div class="footer">
        <p>&copy; {% now "Y" %} TramHon. All rights reserved.</p>
    </div>
</div>
</body>
</html>
