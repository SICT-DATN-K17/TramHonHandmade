<!DOCTYPE html>
<html lang="vi">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>OTP Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f6f9fc;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .content {
            padding: 40px;
            color: #334155;
            line-height: 1.6;
        }
        .otp-box {
            background-color: #f1f5f9;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            margin: 30px 0;
        }
        .otp-code {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 32px;
            font-weight: bold;
            color: #0f172a;
            letter-spacing: 6px;
        }
        .footer {
            background-color: #f8fafc;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }
        .warning {
            color: #ef4444;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Yêu cầu xác thực</h1>
    </div>
    <div class="content">
        <p>Xin chào,</p>
        <p>Bạn vừa yêu cầu đăng ký tài khoản tại Trạm Hồn. Vui lòng sử dụng Mã xác thực một lần (OTP) sau để hoàn tất đăng ký:</p>

        <div class="otp-box">
            <span class="otp-code">{{ otp }}</span>
        </div>

        <p>Mã này có hiệu lực trong <strong>5 phút</strong>.</p>

        <p class="warning">Nếu bạn không yêu cầu mã này, vui lòng bỏ qua email.</p>
    </div>
    <div class="footer">
        <p>&copy; {% now "Y" %} TramHon. All rights reserved.</p>
    </div>
</div>
</body>
</html>
