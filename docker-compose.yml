version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tramhon_odoo_db
    env_file: ./odoo/.env
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    ports:
      - "5433:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:16.0
    container_name: tramhon_odoo16
    depends_on:
      - db
    env_file: ./odoo/.env
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    ports:
      - "8070:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./odoo/custom_addons:/mnt/extra-addons
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: tramhon_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - odoo
      - redis
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  celery_worker:
    build: ./backend
    container_name: tramhon_celery
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    env_file: ./backend/.env
    command: celery -A backend worker -l info
    restart: unless-stopped
  
  redis:
    image: redis:7-alpine
    container_name: tramhon_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tramhon_frontend
    depends_on:
      - backend
    env_file: ./frontend/.env
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data: